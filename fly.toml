# fly.toml app configuration file generated for nature-app
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "nature-app"
primary_region = "mad"  # Madrid - Cambia según tu ubicación (mad, fra, lhr, etc.)

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Volumen para datos persistentes (SQLite + uploads)
[mounts]
  source = "nature_app_data"
  destination = "/app/data"
  initial_size = "1gb"

# Configuración de recursos
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_gb = 1
